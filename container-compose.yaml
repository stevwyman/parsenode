services:
  llmnode:
    build: .
    image: llmnode
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      # LLMNODE_API_KEY: change-me
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
